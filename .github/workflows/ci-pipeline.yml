name: CI Pipeline (Base)

on:
  workflow_call:
    inputs:
      git_branch:
        required: true
        type: string
      release_type:
        required: false
        type: string
        default: ""
      should_increment_tag:
        required: false
        type: boolean
        default: false
      should_publish_npm:
        required: false
        type: boolean
        default: false
    secrets:
      NPM_TOKEN:
        required: false

env:
  PACKAGE_NAME: 'sgraph-ai-send'

jobs:
  run-tests:
    name: "Run Tests"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  increment-tag:
    name: Increment Tag
    runs-on: ubuntu-latest
    needs: [run-tests]
    env:
      GIT__BRANCH: ${{ inputs.git_branch }}
    steps:
      - uses: actions/checkout@v4

      - name: Increment Tag
        if: inputs.should_increment_tag
        uses: ./.github/actions/git__increment-tag
        with:
          release_type: ${{ inputs.release_type }}

  publish-to-npm:
    if: inputs.should_publish_npm && needs.increment-tag.result == 'success'
    name: "Publish to: NPM"
    runs-on: ubuntu-latest
    needs: [increment-tag]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Git Update Current Branch
        uses: owasp-sbot/OSBot-GitHub-Actions/.github/actions/git__update_branch@dev

      - name: Install dependencies
        run: npm ci

      - name: Publish to NPM
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
